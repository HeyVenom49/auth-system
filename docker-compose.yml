services:
  postgresdb:
    image: postgres:latest
    container_name: postgresdb

    ports:
      - "5432:5432"

    environment:
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
